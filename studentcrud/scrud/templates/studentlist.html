<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <!-- Fontawesom CDN -->
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>

    <body>
        <header>
            <div class="container-fluid p-3 bg-light d-flex align-items-center">
                <i class="fa-solid fa-user-graduate" style="font-size: 30px; color: green;"></i>
                <h5>Student CRUD</h5>
            </div>
        </header>
        <div class="container-fluid " style="min-height: 90vh;">
            <div class="container-fluid align-items-center d-flex justify-content-between">
                <h3>Students</h3>
                <a href="{% url 'add' %}" class="btn btn-primary ">Add new student +</a>
            </div>
        {% if data %}
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Batch</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td>{{i.id}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.batch}}</td>
                    <td>
                        <a href="" class="btn btn-warning">Edit</a>
                        <a href="{% url 'delete' i.id %}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>

                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <h2 class="text-center my-5 text-danger">No student data available!!</h2>
        {% endif %}
        </div>

        <!-- <div>
            {% for i in data %}
                <h2>{{i.name}}</h2>
            {% endfor %}
        </div> -->
        <footer>
            <!-- place footer here -->
             <div class="container-fluid ">
                <p class="">Student CRUD &copy;2026</p>
             </div>
        </footer>
        
    </body>
</html>
