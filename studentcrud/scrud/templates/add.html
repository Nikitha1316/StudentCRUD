<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>
        <div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 100vh;">
            <div class=" bg-light w-50 shadow p-3">
                <h2 class="text-center my-3">Add Student</h2>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    Name:
                    <input type="text" name="name"class="mb-3 form-control">
                    DOB:
                    <input type="date" name="dob"class="mb-3 form-control">
                    Email ID:
                    <input type="email" name="email"class="mb-3 form-control">
                    Batch:
                    <input type="text" name="batch"class="mb-3 form-control">
                    Picture:
                    <input type="file" name="picture"class="mb-3 form-control">
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success">Submit</button>
                        <a href="{% url 'list' %}" class="btn btn-warning">Cancel</a>

                    </div>
                </form>
            </div>    
        </div>
        
    </body>
</html>
